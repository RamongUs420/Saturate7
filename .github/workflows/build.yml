cmake_minimum_required(VERSION 3.22)

project(Saturate7 VERSION 1.0.0)

set(CMAKE_CXX_STANDARD 17)
set(CMAKE_CXX_STANDARD_REQUIRED ON)

include(FetchContent)
FetchContent_Declare(
    JUCE
    GIT_REPOSITORY https://github.com/juce-framework/JUCE.git
    GIT_TAG 8.0.4
    GIT_SHALLOW TRUE)
FetchContent_MakeAvailable(JUCE)

juce_add_plugin(Saturate7
    COMPANY_NAME "Saturate"
    IS_SYNTH FALSE
    NEEDS_MIDI_INPUT FALSE
    NEEDS_MIDI_OUTPUT FALSE
    IS_MIDI_EFFECT FALSE
    PLUGIN_MANUFACTURER_CODE Satu
    PLUGIN_CODE Sat7
    FORMATS VST3
    PRODUCT_NAME "Saturate7"
    VST3_CATEGORIES Fx Distortion
    COPY_PLUGIN_AFTER_BUILD FALSE)

target_sources(Saturate7 PRIVATE
    Source/Dsp.h
    Source/PluginProcessor.h
    Source/PluginProcessor.cpp
    Source/PluginEditor.h
    Source/PluginEditor.cpp)

target_compile_definitions(Saturate7 PUBLIC
    JUCE_WEB_BROWSER=0
    JUCE_USE_CURL=0
    JUCE_VST3_CAN_REPLACE_VST2=0
    JUCE_DISPLAY_SPLASH_SCREEN=0)

if(MSVC)
    target_compile_options(Saturate7 PRIVATE /utf-8)
endif()

target_link_libraries(Saturate7
    PRIVATE
        juce::juce_audio_utils
        juce::juce_dsp
    PUBLIC
        juce::juce_recommended_config_flags
        juce::juce_recommended_warning_flags)

# Saturate7 – Saturador / Distorsionador multibanda de 7 bandas (VST3, Windows x64)

Plugin hecho con C++ y JUCE 8. La compilación se hace en la nube con GitHub Actions,
así que no necesitas instalar Visual Studio ni JUCE.

## Cómo obtener el .vst3 compilado

1. Crea una cuenta gratuita en https://github.com y un repositorio nuevo (por ejemplo `Saturate7`).
2. Sube TODO el contenido de esta carpeta al repositorio, incluida la carpeta oculta `.github`.
   - Si arrastrar la carpeta `.github` no funciona en la web, usa **Add file > Create new file**,
     escribe `.github/workflows/build.yml` como nombre y pega el contenido del archivo.
   - O con git: `git init && git add . && git commit -m "Saturate7" && git branch -M main && git remote add origin <URL> && git push -u origin main`
3. Ve a la pestaña **Actions** del repositorio. El workflow *Build Saturate7 VST3* se lanza solo al subir
   el código (o pulsa **Run workflow**). Tarda unos 10-15 minutos la primera vez.
4. Al terminar, entra en la ejecución y descarga el artefacto **Saturate7-VST3-Windows-x64** (un .zip).
